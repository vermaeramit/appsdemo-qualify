# Production stack on one VPS (docs/DEPLOY.md). Run from deploy/prod with a filled-in .env:
#   docker compose pull && docker compose run --rm migrate && docker compose up -d
name: qualify

x-app: &app
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    APP_DATABASE_URL: postgres://qualify_app:${QUALIFY_APP_PASSWORD}@postgres:5432/qualify
    REDIS_URL: redis://redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: '20m', max-file: '5' }

services:
  caddy:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    image: ${IMAGE_PREFIX}/api:${IMAGE_TAG:-latest}
    expose: ['3000']

  worker:
    <<: *app
    image: ${IMAGE_PREFIX}/worker:${IMAGE_TAG:-latest}

  # One-off: docker compose run --rm migrate   (database owner connection)
  migrate:
    image: ${IMAGE_PREFIX}/api:${IMAGE_TAG:-latest}
    profiles: ['tools']
    environment:
      DATABASE_URL: postgres://qualify:${POSTGRES_PASSWORD}@postgres:5432/qualify
    command: ['node', 'node_modules/@qualify/db/dist/scripts/migrate.js']
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qualify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: qualify
      QUALIFY_APP_PASSWORD: ${QUALIFY_APP_PASSWORD:?set QUALIFY_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qualify -d qualify']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional uptime checks (docker compose --profile monitoring up -d); reach it over an SSH tunnel.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ['monitoring']
    restart: unless-stopped
    ports: ['127.0.0.1:3001:3001']
    volumes:
      - uptimekuma:/app/data

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  uptimekuma:
