<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AppsDemo Qualify — AI lead qualification on WhatsApp" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AppsDemo Qualify</title>
    <script>
      // Apply the saved theme before first paint (avoids a light flash in dark mode).
      try {
        var t = localStorage.getItem('qualify-theme');
        var dark =
          t === 'dark' ||
          ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
